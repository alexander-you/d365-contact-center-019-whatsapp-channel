kind: AdaptiveDialog
modelDescription: "Type declarations for WhatsApp 019 global variables (set externally by Omnichannel). Never called – do not delete."
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: SetVariable
      id: declLastInteraction
      variable: Global.wa_LastInteraction
      value: =""

    - kind: SetVariable
      id: declUserId
      variable: Global.wa_UserId
      value: =""

    - kind: SetVariable
      id: declProfileName
      variable: Global.wa_ProfileName
      value: =""

    - kind: SetVariable
      id: declEntryPoint
      variable: Global.wa_EntryPoint
      value: =""

    - kind: SetVariable
      id: declTemplateName
      variable: Global.wa_TemplateName
      value: =""

    - kind: SetVariable
      id: declLineNumber
      variable: Global.wa_LineNumber
      value: =""

    - kind: SetVariable
      id: declOutboundMessageId
      variable: Global.wa_OutboundMessageId
      value: =""

    - kind: SetVariable
      id: declTemplateButton
      variable: Global.wa_TemplateButton
      value: =""

    - kind: SetVariable
      id: declTemplateButtonIndex
      variable: Global.wa_TemplateButtonIndex
      value: =""

    - kind: SetVariable
      id: declCampaignId
      variable: Global.wa_CampaignId
      value: =""

    - kind: SetVariable
      id: declRelatedRecordId
      variable: Global.wa_RelatedRecordId
      value: =""

    - kind: SetVariable
      id: declRelatedEntity
      variable: Global.wa_RelatedEntity
      value: =""

inputType: {}
outputType: {}
