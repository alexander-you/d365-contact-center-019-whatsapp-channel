name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/adapter/package-lock.json
      - run: npm ci
      - run: npm test

  plugins:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build WhatsAppMessaging.Plugins -c Release
      - run: dotnet test WhatsAppMessaging.Plugins.Tests

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep build --file infra/kv-secrets.bicep --stdout > /dev/null
